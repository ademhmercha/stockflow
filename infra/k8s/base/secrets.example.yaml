# Modèle de Secret — NE PAS committer de vraies valeurs.
# Copier ce fichier en `secrets.yaml` (déjà ignoré par git), remplir les
# valeurs réelles, puis l'appliquer avec `kubectl apply -f secrets.yaml`
# ou le référencer depuis un overlay Kustomize.
apiVersion: v1
kind: Secret
metadata:
  name: stockflow-secrets
type: Opaque
stringData:
  MONGO_URI: "mongodb://mongo:27017/stockflow"
  JWT_SECRET: "change-me-in-production"
  JWT_REFRESH_SECRET: "change-me-too-in-production"
