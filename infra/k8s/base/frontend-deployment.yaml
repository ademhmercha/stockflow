apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  # Cf. backend-deployment.yaml : marge alignée pour que les deux rollouts
  # d'un même déploiement (déclenchés ensemble par le pipeline) partagent la
  # même tolérance, même si l'image frontend (Nginx + build statique) est
  # nettement plus légère et pull en pratique bien plus vite.
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/OWNER/stockflow-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Le frontend est un bundle statique servi par Nginx : il n'expose pas
          # /api/health (ce endpoint vit sur le backend). Les probes ciblent donc
          # la racine "/", qui répond dès que Nginx sert index.html ; c'est le
          # service backend qui est sondé sur /api/health.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
