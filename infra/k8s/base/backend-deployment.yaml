apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  # Défaut Kubernetes (600s) trop court : l'image backend embarque Chromium
  # pour Puppeteer (~930 Mo) et un premier pull depuis un registre distant a
  # dépassé 10 minutes en conditions réelles, faisant échouer le rollout à
  # tort alors que le déploiement finissait par réussir juste après.
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/OWNER/stockflow-backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: stockflow-config
            - secretRef:
                name: stockflow-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
