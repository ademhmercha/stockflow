# Copier ce fichier en `secrets.yaml` (ignoré par git) dans ce même dossier,
# puis remplir les vraies valeurs avant de lancer `kubectl apply -k .`
# En production, préférer un gestionnaire de secrets externe (Vault, Sealed
# Secrets, SOPS...) plutôt qu'un Secret Kubernetes en clair.
apiVersion: v1
kind: Secret
metadata:
  name: stockflow-secrets
type: Opaque
stringData:
  MONGO_URI: "mongodb://mongo:27017/stockflow"
  JWT_SECRET: "change-me-production"
  JWT_REFRESH_SECRET: "change-me-production-refresh"
