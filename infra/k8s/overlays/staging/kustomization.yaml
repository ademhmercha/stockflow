apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stockflow-staging
namePrefix: staging-

resources:
  - ../../base
  - secrets.yaml

images:
  # Pointe vers les vraies images GHCR poussées par deploy.yml. Le pipeline
  # n8n déploie ensuite une image précise (tag = SHA du commit) via
  # `kubectl set image`, indépendamment de ce que dit ce fichier — ce n'est
  # que la référence de départ pour un premier `kubectl apply -k` à froid.
  # (Historique : ceci pointait temporairement vers des tags :local pour des
  # tests Minikube sans registre ; réapplique ce fichier avec prudence tant
  # qu'un vrai déploiement piloté par n8n est en cours, sous peine de
  # l'écraser silencieusement — vécu en conditions réelles le 08/08/2026.)
  - name: ghcr.io/OWNER/stockflow-backend
    newName: ghcr.io/ademhmercha/stockflow-backend
    newTag: latest
  - name: ghcr.io/OWNER/stockflow-frontend
    newName: ghcr.io/ademhmercha/stockflow-frontend
    newTag: latest

patches:
  - path: ingress-host.yaml
  - path: replicas.yaml

configMapGenerator:
  - name: stockflow-config
    behavior: merge
    literals:
      - CORS_ORIGIN=https://staging.stockflow.example.com
