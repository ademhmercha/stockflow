apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stockflow-staging
namePrefix: staging-

resources:
  - ../../base
  - secrets.yaml

images:
  # TEMPORAIRE pour test local Minikube (voir infra/k8s/README-k8s.md §3) :
  # pointe vers les images buildées dans le daemon Docker de Minikube plutôt
  # que vers GHCR. À revenir à "ghcr.io/OWNER/..." avant un vrai déploiement staging.
  - name: ghcr.io/OWNER/stockflow-backend
    newName: stockflow-backend
    newTag: local
  - name: ghcr.io/OWNER/stockflow-frontend
    newName: stockflow-frontend
    newTag: local

patches:
  - path: ingress-host.yaml
  - path: replicas.yaml

configMapGenerator:
  - name: stockflow-config
    behavior: merge
    literals:
      - CORS_ORIGIN=https://staging.stockflow.example.com
