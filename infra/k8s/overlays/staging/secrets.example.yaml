# Copier ce fichier en `secrets.yaml` (ignoré par git) dans ce même dossier,
# puis remplir les vraies valeurs avant de lancer `kubectl apply -k .`
apiVersion: v1
kind: Secret
metadata:
  name: stockflow-secrets
type: Opaque
stringData:
  # Nom du Service Mongo APRÈS transformation par le namePrefix "staging-" de
  # cet overlay (voir kustomization.yaml) : "mongo" seul ne résout pas, le
  # Service s'appelle réellement "staging-mongo" une fois déployé.
  MONGO_URI: "mongodb://staging-mongo:27017/stockflow"
  JWT_SECRET: "change-me-staging"
  JWT_REFRESH_SECRET: "change-me-staging-refresh"
