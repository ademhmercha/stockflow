server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Support du routing côté client (React Router) : toute route inconnue
    # retombe sur index.html plutôt que de renvoyer un 404 Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
