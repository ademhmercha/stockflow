name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stockflow-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stockflow-frontend

jobs:
  build-and-push:
    name: Build & push les images Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend-image: ${{ steps.tags.outputs.backend }}
      frontend-image: ${{ steps.tags.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Définir les tags d'image (SHA du commit)
        id: tags
        run: |
          echo "backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          target: production
          push: true
          tags: |
            ${{ steps.tags.outputs.backend }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.frontend
          target: production
          push: true
          tags: |
            ${{ steps.tags.outputs.frontend }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-n8n:
    name: Déclencher le workflow n8n
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Appeler le webhook n8n
        run: |
          curl --fail --silent --show-error -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "${{ github.repository }}",
              "commit": "${{ github.sha }}",
              "author": "${{ github.actor }}",
              "backendImage": "${{ needs.build-and-push.outputs.backend-image }}",
              "frontendImage": "${{ needs.build-and-push.outputs.frontend-image }}",
              "environment": "staging"
            }'
